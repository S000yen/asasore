# 無料のサーバーが休止しないよう、10分おきに /health へアクセスする。
# アクセス先は、下の APP_URL に直接書いてある（秘密の情報ではないため）。
# 変えたいときは、この値を書き換える。
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動でも実行できる

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          APP_URL: https://asasore-y7pb.onrender.com
        run: |
          # 休止中だと起動に1分ほどかかるので、待ち時間は長めにとる
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "${APP_URL%/}/health"
